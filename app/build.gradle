// app/build.gradle
// All dependency and plugin versions live in gradle/libs.versions.toml.
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt' // This enables kapt for annotation processing
    alias(libs.plugins.kotlin.compose)
}

// Release signing: keystore.properties in the repo root, else CONSECUTOR_* environment variables.
// If any of the four values is missing the release build stays unsigned. Never log these values.
def keystoreProps = new Properties()
rootProject.file('keystore.properties').with { file ->
    if (file.exists()) file.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey ->
    // A blank property is missing, so the environment variable can still supply it.
    def fromFile = keystoreProps.getProperty(propKey)?.trim()
    def value = fromFile ? fromFile : System.getenv(envKey)?.trim()
    value ? value : null
}
def releaseStoreFile = signingValue('storeFile', 'CONSECUTOR_KEYSTORE')
def releaseStorePassword = signingValue('storePassword', 'CONSECUTOR_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'CONSECUTOR_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'CONSECUTOR_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.squalor.consecutor'
    compileSdkVersion 'android-36.1'

    defaultConfig {
        applicationId "com.squalor.consecutor"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        managedDevices {
            localDevices {
                pixel6api34 {
                    device = "Pixel 6"
                    apiLevel = 34
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    // Local-first persistence
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    kapt libs.androidx.room.compiler

    // Testing
    testImplementation libs.junit
    // JVM implementation of org.json (Public Domain); android.jar's org.json is a stub in local unit tests
    testImplementation libs.org.json
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation platform(libs.androidx.compose.bom)
    debugImplementation libs.androidx.compose.ui.tooling
}
